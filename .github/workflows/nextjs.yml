name: Next.js checks

on:
  push:
    branches: [nextjs-migration]
  pull_request:
    branches: [nextjs-migration]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
