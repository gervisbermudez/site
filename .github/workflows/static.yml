name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches:
      - main # Cambia esto si tu rama principal tiene otro nombre

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build Jekyll site with production config
        run: bundle exec jekyll build --config _config_prod.yml

      - name: Verify redirects to the new site
        run: |
          set -euo pipefail
          test -f _site/404.html
          test ! -d _site/404
          grep -q 'https://gervisbermudez.dev/' _site/index.html
          grep -q 'http-equiv="refresh"' _site/index.html
          grep -q 'noindex' _site/index.html
          ! grep -q 'art-app' _site/index.html
          post="_site/blog/web development/2026/09/07/improve-dont-replace-a-vue-3-button-architecture.html"
          test -f "$post"
          grep -q 'https://gervisbermudez.dev/blog/2026/09/07/improve-dont-replace-a-vue-3-button-architecture/' "$post"
          grep -q 'https://gervisbermudez.dev/' _site/404.html
          grep -q 'noindex' _site/404.html
          grep -q 'https://gervisbermudez.dev/feed.xml' _site/feed.xml
          touch _site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # Rama donde se desplegará el sitio
          folder: _site # Carpeta de salida de Jekyll
