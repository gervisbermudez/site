<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  
  <link rel="canonical" href="https://gervisbermudez.dev/">
  <meta name="robots" content="noindex">
  
  <!-- This page is missing. Legacy deploy check: /site/public/css/styles.css -->
  <script>
    (function () {
      var base = "https://gervisbermudez.dev";
      var path = "/";
      try {
        path = decodeURIComponent(location.pathname || "/");
      } catch (e) {
        path = location.pathname || "/";
      }
      var prefix = "/site";
      if (prefix && path.indexOf(prefix) === 0) {
        path = path.slice(prefix.length) || "/";
      }
      if (path.charAt(0) !== "/") path = "/" + path;
      var target = base + "/";
      var post = path.match(/^\/blog\/[^/]+\/(\d{4})\/(\d{2})\/(\d{2})\/([^/]+)\/?$/);
      var paged = path.match(/^\/blog\/page(\d+)\/?$/);
      if (post) {
        target = base + "/blog/" + post[1] + "/" + post[2] + "/" + post[3] + "/" + post[4] + "/";
      } else if (paged) {
        target = base + "/blog/page/" + paged[1] + "/";
      } else if (/^\/author(\/|$)/.test(path)) {
        target = base + "/about-me/";
      } else if (/^\/category(\/|$)/.test(path)) {
        target = base + "/blog/";
      } else if (/^\/portfolio\/[^/]+\/?$/.test(path) || /^\/(blog|portfolio|about-me|contact|journey)\/?$/.test(path)) {
        if (path.length > 1 && path.charAt(path.length - 1) !== "/") path += "/";
        target = base + path;
      } else if (/^\/blog\//.test(path)) {
        target = base + "/blog/";
      }
      location.replace(target);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://gervisbermudez.dev/"></noscript>
  
</head>
<body>
  <p><a href="https://gervisbermudez.dev/">Continue</a></p>
</body>
</html>
