  - id: santander
    emoji: "🏦"
    title: "Santander Tecnología"
    period: "Sep 2023 — May 2026"
    role: "Software Engineer · Investments tribe"
    stack:
      - React
      - TypeScript
      - Microfrontends
      - OpenShift
      - Kubernetes
    story: |
      Investments tribe, microfrontends, and a lot of coffee. React + TypeScript at bank scale — corporate funds, a digital-signature flow that could not go down, plus the people who made OpenShift, Grafana, and Dynatrace feel less scary.

      Observability stopped being optional. Neither did the after-office photos.
