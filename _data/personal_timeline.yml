  - id: netglobal
    emoji: "🛰️"
    title: "Netglobal Solutions"
    period: "Jul 2020 — Oct 2021"
    role: "Software Engineer / Frontend"
    stack:
      - React
      - Angular
      - TypeScript
      - Figma
    story: |
      DirecTV's fleet dashboard, Figma to pixels. React + Angular + TypeScript, a CSS renovation that the legacy stylesheets did not ask for, and a ~30% load-time win that made the ops team slightly less grumpy.

      A few photos leaked into 2022/2024. Some crews don't really end when the contract does.
