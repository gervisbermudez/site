title: "The journey behind the commits"
lead: "The CV is the résumé version. This is the hallway version — offices, teammates, late deploys, and the stuff I actually learned along the way. Captions are still a WIP; the photos are the first draft. 📸"

chapters:
  - id: webfindyou
    emoji: "🚀"
    title: "WebFindYou"
    period: "Jun 2015 — Apr 2018"
    role: "Team Leader | Frontend"
    stack:
      - React
      - Responsive UI
      - Agency CMS
      - SEO
    story: |
      First real arena. Agency speed, a proprietary CMS, and more landing pages than I can count. I went from shipping layouts to leading a frontend crew — React components, mobile-first, and keeping marketing sites fast enough that SEO didn't hate us.

      Also: a lot of late nights, a lot of clients, and the first time I understood that "the CMS is the product."
