  - id: quares
    emoji: "⚡"
    title: "Quares IT Solutions"
    period: "Sep 2019 — Jul 2020"
    role: "Frontend Developer"
    stack:
      - Frontend
      - Agile
      - UI/UX
      - Performance
    story: |
      Experta Seguros and other "please don't break production" accounts. Agile cadence, product sitting next to engineering, and a 20% speed bump that came from sweating the UI instead of adding another library.

      Short chapter, dense photos — this team took a lot of pictures. I'm not complaining.
