  - id: xyclon
    emoji: "🌍"
    title: "Xyclon"
    period: "Aug 2018 — Sep 2019"
    role: "Full Stack Web Developer"
    stack:
      - PHP
      - Laravel
      - React
      - MySQL
    story: |
      Full stack, for real. Laravel on the back, React on the front, and international accounts like Natura. Database migrations, UI rewrites, and that satisfying moment when the platform stops feeling like a museum.

      A couple of these shots are later hangouts (2022). Once a team, always a WhatsApp group. 😄
