  - id: tsoft-telefonica
    emoji: "📱"
    title: "Tsoft × Telefónica / Tuenti"
    period: "Oct 2021 — Sep 2023"
    role: "Frontend Web Developer"
    stack:
      - React
      - React Native
      - TypeScript
      - Node.js
      - OpenShift
    story: |
      Tsoft was the badge; Tuenti (Telefónica) was the product. Official app, React + React Native, TypeScript everywhere, Node APIs, and CI/CD on OpenShift/Kubernetes. First time "enterprise infra" stopped being a slide and started being my Tuesday.

      Two folders of photos, one chapter — that's how contractor life looks from the inside.
