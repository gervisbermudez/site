<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">MyButton architecture</title>
  <desc id="archDesc">App.vue is a living catalog. The component folder holds types, the Vue SFC, and tests. Own props go through defineProps. Native attributes fall through. The root is a real HTML button.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d2a3a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="780" rx="16" fill="#f4f7fb"/>
  <text x="40" y="48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a3a">MyButton architecture</text>
  <text x="40" y="76" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#5b6b7c">Improve the native control. Do not replace it.</text>

  <!-- App.vue -->
  <rect x="250" y="100" width="500" height="70" rx="10" fill="#fff" stroke="#d7dee8" filter="url(#shadow)"/>
  <text x="500" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1d2a3a">App.vue</text>
  <text x="500" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6b7c">Living catalog. Not the component. Not in the package.</text>

  <line x1="500" y1="170" x2="500" y2="204" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Folder -->
  <rect x="40" y="214" width="920" height="196" rx="12" fill="#fff" stroke="#42b883" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#42b883">src/components/MyButton/</text>

  <rect x="64" y="262" width="272" height="118" rx="8" fill="#eef5ff" stroke="#3178c6"/>
  <text x="200" y="298" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#3178c6">MyButton.types.ts</text>
  <text x="200" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#1d2a3a">The contract</text>
  <text x="200" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6b7c">Own props vs native HTML</text>

  <rect x="364" y="262" width="272" height="118" rx="8" fill="#eefaf4" stroke="#42b883"/>
  <text x="500" y="298" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2f855a">MyButton.vue</text>
  <text x="500" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#1d2a3a">The native button</text>
  <text x="500" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6b7c">Single root. No $attrs proxy.</text>

  <rect x="664" y="262" width="272" height="118" rx="8" fill="#f4f0fb" stroke="#7c5cbf"/>
  <text x="800" y="298" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#6b46c1">MyButton.test.ts</text>
  <text x="800" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#1d2a3a">What cannot break</text>
  <text x="800" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6b7c">27 tests. element.click()</text>

  <line x1="500" y1="410" x2="500" y2="444" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="230" y1="444" x2="770" y2="444" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="230" y1="444" x2="230" y2="464" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="444" x2="770" y2="464" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- defineProps -->
  <rect x="40" y="474" width="380" height="130" rx="10" fill="#fff" stroke="#3178c6" filter="url(#shadow)"/>
  <text x="230" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#3178c6">defineProps  /  MyButtonProps</text>
  <text x="230" y="528" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1d2a3a">variant  /  size  /  loading</text>
  <text x="230" y="548" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1d2a3a">iconPosition  /  disabled  /  type</text>
  <text x="230" y="576" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6b7c">Declared because the component reads them.</text>

  <!-- fallthrough -->
  <rect x="580" y="474" width="380" height="130" rx="10" fill="#fff" stroke="#5b6b7c" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <text x="770" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6b7c">Vue 3 fallthrough</text>
  <text x="770" y="528" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1d2a3a">id  /  aria-*  /  class  /  data-*</text>
  <text x="770" y="548" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1d2a3a">@click  /  name  /  form</text>
  <text x="770" y="576" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6b7c">Not in defineProps, or @click becomes a prop.</text>

  <line x1="230" y1="604" x2="230" y2="640" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="770" y1="604" x2="770" y2="640" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="230" y1="640" x2="770" y2="640" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="500" y1="640" x2="500" y2="660" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- native button -->
  <rect x="250" y="670" width="500" height="78" rx="10" fill="#1d2a3a" filter="url(#shadow)"/>
  <text x="500" y="702" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#fff">&lt;button&gt;</text>
  <text x="500" y="726" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#c5d0dc">Real HTML. Not a div with role=&quot;button&quot;.</text>
</svg>
