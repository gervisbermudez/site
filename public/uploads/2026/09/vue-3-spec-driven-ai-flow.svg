<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="sddTitle sddDesc">
  <title id="sddTitle">Spec-driven development with AI agents</title>
  <desc id="sddDesc">Write the spec first. One agent implements. A second agent with a fresh context reviews. Then fixes, tests, UX and accessibility. The human still opens the browser. If the thesis breaks, go back.</desc>
  <defs>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <filter id="shadowS" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d2a3a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="900" rx="16" fill="#f4f7fb"/>
  <text x="40" y="48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a3a">Spec-driven development</text>
  <text x="40" y="76" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#5b6b7c">Specs first. Then agents. Then I still test it myself.</text>

  <rect x="250" y="100" width="500" height="56" rx="10" fill="#fff" stroke="#d7dee8" filter="url(#shadowS)"/>
  <text x="500" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d2a3a">1. Brief</text>

  <line x1="500" y1="156" x2="500" y2="184" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrowS)"/>

  <rect x="160" y="192" width="680" height="88" rx="10" fill="#1d2a3a" filter="url(#shadowS)"/>
  <text x="500" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">2. Spec / thesis</text>
  <text x="500" y="254" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#c5d0dc">Improve the native button. Do not replace it.</text>

  <line x1="500" y1="280" x2="500" y2="308" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrowS)"/>

  <rect x="160" y="316" width="680" height="64" rx="10" fill="#eefaf4" stroke="#42b883" filter="url(#shadowS)"/>
  <text x="500" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f855a">3. Agent implements against the spec</text>
  <text x="500" y="364" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6b7c">Cursor. Stages, not one giant prompt.</text>

  <line x1="500" y1="380" x2="500" y2="408" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrowS)"/>

  <rect x="160" y="416" width="680" height="64" rx="10" fill="#eef5ff" stroke="#3178c6" filter="url(#shadowS)"/>
  <text x="500" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#3178c6">4. Agent reviews (fresh context)</text>
  <text x="500" y="464" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5b6b7c">Different chat. It did not write the code.</text>

  <path d="M 160 448 L 80 448 L 80 348 L 160 348" fill="none" stroke="#cb3837" stroke-width="2" marker-end="url(#arrowS)"/>
  <text x="28" y="404" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#cb3837">thesis</text>
  <text x="22" y="420" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#cb3837">broke?</text>

  <line x1="500" y1="480" x2="500" y2="508" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrowS)"/>

  <rect x="40" y="516" width="280" height="72" rx="10" fill="#fff" stroke="#d7dee8" filter="url(#shadowS)"/>
  <text x="180" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2a3a">5. Agent fixes</text>
  <text x="180" y="568" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6b7c">From the review.</text>

  <rect x="360" y="516" width="280" height="72" rx="10" fill="#fff" stroke="#d7dee8" filter="url(#shadowS)"/>
  <text x="500" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2a3a">6. Agent writes tests</text>
  <text x="500" y="568" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6b7c">After the fixes.</text>

  <rect x="680" y="516" width="280" height="72" rx="10" fill="#fff" stroke="#d7dee8" filter="url(#shadowS)"/>
  <text x="820" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d2a3a">7. Agent: UX / a11y</text>
  <text x="820" y="568" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5b6b7c">Focus, names, motion.</text>

  <line x1="180" y1="588" x2="180" y2="628" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="500" y1="588" x2="500" y2="628" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="820" y1="588" x2="820" y2="628" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="180" y1="628" x2="820" y2="628" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="500" y1="628" x2="500" y2="656" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arrowS)"/>

  <rect x="160" y="664" width="680" height="88" rx="10" fill="#fff8f6" stroke="#cb3837" filter="url(#shadowS)"/>
  <text x="500" y="700" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#cb3837">8. Me, in the browser</text>
  <text x="500" y="726" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#1d2a3a">Enviar and Cancelar. Mouse and keyboard. Small commits.</text>

  <text x="40" y="792" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#5b6b7c">The spec is the steering wheel. The agents are not.</text>
  <text x="40" y="816" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#5b6b7c">A built-in spinner or a custom click emit looks helpful. It is not.</text>
  <text x="40" y="856" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8fa0b3">Same source. Different chats. I still own the thesis.</text>
</svg>
